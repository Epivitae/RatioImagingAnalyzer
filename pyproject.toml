[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ria-gui"
version = "1.8.1.5"

authors = [
  { name = "Kui Wang" },           # 这一项只写名字，会被映射到 Author 字段
  { email = "k@cns.ac.cn" },       # 这一项只写邮箱，会被映射到 Author-email 字段
]



maintainers = [
  { name = "Kui Wang", email = "k@cns.ac.cn" },
]

description = "RIA: Ratio Imaging Analyzer for biological quantification"

# 更规范的 readme 写法（带 content-type）
readme = { file = "README.md", content-type = "text/markdown" }

requires-python = ">=3.8"

# 让 pip show 显示 License
license = { text = "MIT License" }

keywords = ["imaging", "biology", "quantification", "ratio", "gui", "fluorescence"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy",
    "matplotlib",
    "tifffile",
    "opencv-python",
    "requests",
    "packaging",           # [新增] 对应你发布脚本中的版本解析
    "rich",                # [新增] 对应你脚本中的 UI 显示
    "aicsimageio",         # [新增] OIR 读取核心
    "bioformats_jar",      # [新增] Java 桥接
    "imagecodecs",         # [新增] 复杂格式解码
    "xsdata-pydantic-basemodel", # [新增] 修复之前遇到的元数据解析报错
]

[project.urls]
Homepage = "https://github.com/Epivitae/RatioImagingAnalyzer"
Documentation = "https://github.com/Epivitae/RatioImagingAnalyzer/wiki"
Source = "https://github.com/Epivitae/RatioImagingAnalyzer"
Issues = "https://github.com/Epivitae/RatioImagingAnalyzer/issues"

[project.scripts]
ria = "ria_gui.main:main"
