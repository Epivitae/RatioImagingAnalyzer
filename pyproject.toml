[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ria-gui"
version = "1.8.4"

authors = [
  { name = "Kui Wang" },           # 这一项只写名字，会被映射到 Author 字段
  { email = "k@cns.ac.cn" },       # 这一项只写邮箱，会被映射到 Author-email 字段
]



maintainers = [
  { name = "Kui Wang", email = "k@cns.ac.cn" },
]

description = "RIA: Ratio Imaging Analyzer for biological quantification"

# 更规范的 readme 写法（带 content-type）
readme = { file = "README.md", content-type = "text/markdown" }

requires-python = ">=3.8"

# 让 pip show 显示 License
license = { text = "MIT License" }

keywords = ["imaging", "biology", "quantification", "ratio", "gui", "fluorescence"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23,<2.0",
    "matplotlib>=3.5,<3.10",
    "tifffile>=2023.2,<2024.0",
    "opencv-python>=4.5,<5.0",
    "requests>=2.25,<3.0",
    "packaging>=23.0,<25.0",
    "rich>=13.0,<15.0",
    "aicsimageio>=4.12,<5.0",
    "bioformats_jar>=2020.5,<2026.0",
    "imagecodecs>=2023.1,<2024.0",
    #"xsdata-pydantic-basemodel>=24.0,<26.0",
]


[project.urls]
Homepage = "https://github.com/Epivitae/RatioImagingAnalyzer"
Documentation = "https://github.com/Epivitae/RatioImagingAnalyzer/wiki"
Source = "https://github.com/Epivitae/RatioImagingAnalyzer"
Issues = "https://github.com/Epivitae/RatioImagingAnalyzer/issues"

[project.scripts]
ria = "ria_gui.main:main"
